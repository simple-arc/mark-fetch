<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web → .md</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .brand {
            font-size: 28px;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            font-size: 28px;
            color: #888888;
        }

        .sub {
            font-size: 14px;
            color: #888888;
            text-align: center;
            margin-top: -10px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .search-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 700px;
        }

        .search-row input {
            flex: 1;
            background: #111111;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 16px 22px;
            font-family: inherit;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            font-weight: 300;
        }

        .search-row input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
        }

        .search-row input::placeholder {
            color: #555555;
            font-style: italic;
        }

        .search-row button {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 16px 32px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-row button:hover {
            background: #e0e0e0;
            transform: scale(1.01);
        }

        .search-row button:active {
            transform: scale(0.96);
        }

        .output {
            display: none;
            width: 100%;
            margin-top: 20px;
            border-top: 1px solid #333333;
            padding-top: 24px;
        }

        .output.visible {
            display: block;
            animation: fade 0.2s ease;
        }

        @keyframes fade {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .preview {
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 18px 22px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            color: #dddddd;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        .preview .empty-state {
            color: #555555;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
            gap: 10px;
        }

        .preview::-webkit-scrollbar {
            width: 4px;
        }
        .preview::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        .preview::-webkit-scrollbar-thumb {
            background: #444444;
            border-radius: 10px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: flex-end;
        }

        .actions button {
            background: transparent;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 300;
        }

        .actions button:hover {
            background: #1a1a1a;
            border-color: #666666;
        }

        .actions button.primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .actions button.primary:hover {
            background: #e0e0e0;
            border-color: #e0e0e0;
        }

        .status {
            margin-top: 16px;
            font-size: 11px;
            color: #555555;
            display: flex;
            justify-content: flex-end;
            padding-top: 10px;
            border-top: 1px solid #222222;
            font-weight: 300;
        }

        .status i {
            margin-right: 4px;
        }

        /* markdown styling inside preview */
        .preview h1,
        .preview h2,
        .preview h3 {
            color: #ffffff;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        .preview h1 {
            font-size: 1.4em;
        }
        .preview h2 {
            font-size: 1.2em;
            color: #dddddd;
        }
        .preview h3 {
            font-size: 1.05em;
            color: #cccccc;
        }
        .preview strong {
            color: #ffffff;
        }
        .preview em {
            color: #aaaaaa;
        }
        .preview a {
            color: #88bbdd;
            text-decoration: underline;
        }
        .preview code {
            background: #1a1a1a;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            color: #ccddcc;
            font-family: inherit;
        }
        .preview ul,
        .preview ol {
            padding-left: 24px;
            margin: 6px 0;
        }
        .preview li {
            margin: 2px 0;
        }
        .preview blockquote {
            border-left: 2px solid #444444;
            padding-left: 14px;
            color: #aaaaaa;
            margin: 8px 0;
        }
        .preview hr {
            border: none;
            border-top: 1px solid #333333;
            margin: 12px 0;
        }

        @media (max-width: 600px) {
            .search-row {
                flex-direction: column;
            }
            .search-row button {
                justify-content: center;
            }
            .brand {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="main">
        <div class="brand">
            <i class="fas fa-arrow-right"></i> .md
        </div>
        <div class="sub">
            get the main content of any page as Markdown
        </div>

        <div class="search-row">
            <input type="text" id="urlInput" placeholder="paste any URL …" autofocus>
            <button id="fetchBtn"><i class="fas fa-arrow-right"></i> convert</button>
        </div>

        <div class="output" id="outputArea">
            <div class="preview" id="previewBox">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-pulse"></i> fetching …
                </div>
            </div>
            <div class="actions">
                <button class="primary" id="downloadBtn"><i class="fas fa-download"></i> download .md</button>
                <button id="clearBtn"><i class="fas fa-times"></i> clear</button>
            </div>
            <div class="status">
                <span><span id="charCount">0</span> chars</span>
            </div>
        </div>
    </div>

</div>

<script>
    (function() {
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const previewBox = document.getElementById('previewBox');
        const outputArea = document.getElementById('outputArea');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const charCount = document.getElementById('charCount');

        let currentMarkdown = '';

        function renderMarkdown(md) {
            currentMarkdown = md;
            if (!md || md.trim() === '') {
                previewBox.innerHTML = `<div class="empty-state"><i class="fas fa-terminal"></i>  markdown will appear here</div>`;
                charCount.textContent = '0';
                return;
            }

            let html = md
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/^[\-\*]\s+(.*)$/gim, '<li>$1</li>')
                .replace(/^\d+\.\s+(.*)$/gim, '<li>$1</li>')
                .replace(/^>\s+(.*)$/gim, '<blockquote>$1</blockquote>')
                .replace(/^---$/gim, '<hr>')
                .split('\n\n').map(para => {
                    if (para.trim() === '') return '';
                    if (para.match(/^<[h1|h2|h3|ul|ol|li|blockquote|hr]/)) return para;
                    if (para.match(/^<li>/)) return para;
                    return `<p>${para}</p>`;
                }).join('');

            html = html.replace(/(<li>.*?<\/li>)\s*(?=<li>)/g, '$1');
            html = html.replace(/(<li>.*?<\/li>)+/g, (match) => {
                return `<ul>${match}</ul>`;
            });

            previewBox.innerHTML = html;
            charCount.textContent = md.length;
        }

        async function fetchWithDefuddle(url) {
            const apiUrl = `https://defuddle.md/${url}`;

            try {
                const response = await fetch(apiUrl, {
                    signal: AbortSignal.timeout(15000),
                    headers: { 'Accept': 'text/markdown' }
                });

                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }

                return await response.text();
            } catch (error) {
                console.error('API error:', error);
                throw new Error(`Fetch failed: ${error.message}`);
            }
        }

        async function fetchWebpage(url) {
            let cleanUrl = url.trim();
            if (!cleanUrl) {
                alert('Enter a URL.');
                return;
            }
            if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
                cleanUrl = 'https://' + cleanUrl;
            }

            outputArea.classList.add('visible');
            previewBox.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i>  fetching ${cleanUrl} …</div>`;

            try {
                const markdown = await fetchWithDefuddle(cleanUrl);

                if (!markdown || markdown.trim().length < 10) {
                    throw new Error('No readable content found.');
                }

                renderMarkdown(markdown);
                outputArea.classList.add('visible');

            } catch (err) {
                previewBox.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i>  ${err.message || 'Failed to fetch'}</div>`;
                outputArea.classList.add('visible');
            }
        }

        function downloadMarkdown() {
            if (!currentMarkdown || currentMarkdown.trim() === '') {
                alert('Convert a webpage first.');
                return;
            }
            const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `page-${Date.now()}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearAll() {
            urlInput.value = '';
            outputArea.classList.remove('visible');
            currentMarkdown = '';
            renderMarkdown('');
            urlInput.focus();
        }

        fetchBtn.addEventListener('click', () => fetchWebpage(urlInput.value));
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                fetchWebpage(urlInput.value);
            }
        });
        downloadBtn.addEventListener('click', downloadMarkdown);
        clearBtn.addEventListener('click', clearAll);

        renderMarkdown('');
        outputArea.classList.remove('visible');
        urlInput.focus();
    })();
</script>
</body>
</html>
