<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>web → .md</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── brand / header ── */
    .brand {
      font-size: 42px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -1px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .brand .arrow {
      color: #444444;
      font-weight: 300;
    }

    .sub {
      font-size: 20px;
      color: #666666;
      text-align: center;
      margin-bottom: 40px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* ── search row ── */
    .search-row {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 700px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      background: #121212;
    }

    .search-row input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 18px 22px;
      font-family: inherit;
      font-size: 16px;
      color: #e0e0e0;
      outline: none;
      font-weight: 400;
      min-width: 0;
    }

    .search-row input::placeholder {
      color: #444444;
    }

    .search-row button {
      background: transparent;
      color: #e0e0e0;
      border: none;
      border-left: 1px solid #2a2a2a;
      padding: 18px 28px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #888888;
    }

    .search-row button:hover {
      background: #1a1a1a;
      color: #e0e0e0;
    }

    /* ── output panel ── */
    .output {
      display: none;
      width: 100%;
      margin-top: 40px;
    }

    .output.visible {
      display: block;
      animation: fade 0.25s ease;
    }

    @keyframes fade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    .preview {
      background: #0e0e0e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 24px 28px;
      min-height: 200px;
      max-height: 500px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cccccc;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    }

    .preview .empty-state {
      color: #444444;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
      gap: 10px;
      font-style: normal;
    }

    .preview::-webkit-scrollbar {
      width: 4px;
    }
    .preview::-webkit-scrollbar-track {
      background: #0e0e0e;
    }
    .preview::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 10px;
    }

    /* ── actions & status ── */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .actions button {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #888888;
      padding: 8px 18px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 400;
    }

    .actions button:hover {
      background: #1a1a1a;
      border-color: #444444;
      color: #e0e0e0;
    }

    .actions button.primary {
      background: #e0e0e0;
      color: #0a0a0a;
      border-color: #e0e0e0;
    }

    .actions button.primary:hover {
      background: #cccccc;
      border-color: #cccccc;
    }

    .status {
      margin-top: 14px;
      font-size: 12px;
      color: #444444;
      display: flex;
      justify-content: flex-end;
      font-weight: 400;
    }

    /* ── markdown preview styles ── */
    .preview h1,
    .preview h2,
    .preview h3 {
      color: #e0e0e0;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .preview h1 {
      font-size: 1.5em;
    }
    .preview h2 {
      font-size: 1.25em;
      color: #cccccc;
    }
    .preview h3 {
      font-size: 1.1em;
      color: #bbbbbb;
    }
    .preview strong {
      color: #e0e0e0;
      font-weight: 600;
    }
    .preview em {
      color: #999999;
    }
    .preview a {
      color: #88aacc;
      text-decoration: underline;
    }
    .preview code {
      background: #1a1a1a;
      padding: 0.1rem 0.5rem;
      border-radius: 4px;
      color: #bbccbb;
      font-family: inherit;
    }
    .preview ul,
    .preview ol {
      padding-left: 24px;
      margin: 6px 0;
    }
    .preview li {
      margin: 2px 0;
    }
    .preview blockquote {
      border-left: 2px solid #333333;
      padding-left: 14px;
      color: #999999;
      margin: 8px 0;
    }
    .preview hr {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 12px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 16px;
      }
      .brand {
        font-size: 30px;
      }
      .sub {
        font-size: 16px;
        margin-bottom: 30px;
      }
      .search-row {
        flex-direction: row;
      }
      .search-row button {
        padding: 18px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="main">
    <div class="brand">
      <span class="arrow">→</span> .md
    </div>
    <div class="sub">
      Get the main content of any page as Markdown
    </div>

    <div class="search-row">
      <input type="text" id="urlInput" placeholder="paste any URL …" autofocus>
      <button id="fetchBtn">→ convert</button>
    </div>

    <div class="output" id="outputArea">
      <div class="preview" id="previewBox">
        <div class="empty-state">
          <span>◌</span> fetching …
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="downloadBtn">↓ download .md</button>
        <button id="clearBtn">✕ clear</button>
      </div>
      <div class="status">
        <span><span id="charCount">0</span> chars</span>
      </div>
    </div>
  </div>

</div>

<script>
  (function() {
    const urlInput = document.getElementById('urlInput');
    const fetchBtn = document.getElementById('fetchBtn');
    const previewBox = document.getElementById('previewBox');
    const outputArea = document.getElementById('outputArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const charCount = document.getElementById('charCount');

    let currentMarkdown = '';

    function renderMarkdown(md) {
      currentMarkdown = md;
      if (!md || md.trim() === '') {
        previewBox.innerHTML = `<div class="empty-state"><span>◌</span> markdown will appear here</div>`;
        charCount.textContent = '0';
        return;
      }

      let html = md
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/^[\-\*]\s+(.*)$/gim, '<li>$1</li>')
        .replace(/^\d+\.\s+(.*)$/gim, '<li>$1</li>')
        .replace(/^>\s+(.*)$/gim, '<blockquote>$1</blockquote>')
        .replace(/^---$/gim, '<hr>')
        .split('\n\n').map(para => {
          if (para.trim() === '') return '';
          if (para.match(/^<[h1|h2|h3|ul|ol|li|blockquote|hr]/)) return para;
          if (para.match(/^<li>/)) return para;
          return `<p>${para}</p>`;
        }).join('');

      html = html.replace(/(<li>.*?<\/li>)\s*(?=<li>)/g, '$1');
      html = html.replace(/(<li>.*?<\/li>)+/g, (match) => {
        return `<ul>${match}</ul>`;
      });

      previewBox.innerHTML = html;
      charCount.textContent = md.length;
    }

    async function fetchWithDefuddle(url) {
      const apiUrl = `https://defuddle.md/${url}`;

      try {
        const response = await fetch(apiUrl, {
          signal: AbortSignal.timeout(15000),
          headers: { 'Accept': 'text/markdown' }
        });

        if (!response.ok) {
          throw new Error(`API returned ${response.status}`);
        }

        return await response.text();
      } catch (error) {
        console.error('API error:', error);
        throw new Error(`Fetch failed: ${error.message}`);
      }
    }

    async function fetchWebpage(url) {
      let cleanUrl = url.trim();
      if (!cleanUrl) {
        alert('Enter a URL.');
        return;
      }
      if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
        cleanUrl = 'https://' + cleanUrl;
      }

      outputArea.classList.add('visible');
      previewBox.innerHTML = `<div class="empty-state"><span>◌</span> fetching ${cleanUrl} …</div>`;

      try {
        const markdown = await fetchWithDefuddle(cleanUrl);

        if (!markdown || markdown.trim().length < 10) {
          throw new Error('No readable content found.');
        }

        renderMarkdown(markdown);
        outputArea.classList.add('visible');

      } catch (err) {
        previewBox.innerHTML = `<div class="empty-state"><span>◌</span> ${err.message || 'Failed to fetch'}</div>`;
        outputArea.classList.add('visible');
      }
    }

    function downloadMarkdown() {
      if (!currentMarkdown || currentMarkdown.trim() === '') {
        alert('Convert a webpage first.');
        return;
      }
      const blob = new Blob([currentMarkdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `page-${Date.now()}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function clearAll() {
      urlInput.value = '';
      outputArea.classList.remove('visible');
      currentMarkdown = '';
      renderMarkdown('');
      urlInput.focus();
    }

    fetchBtn.addEventListener('click', () => fetchWebpage(urlInput.value));
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        fetchWebpage(urlInput.value);
      }
    });
    downloadBtn.addEventListener('click', downloadMarkdown);
    clearBtn.addEventListener('click', clearAll);

    renderMarkdown('');
    outputArea.classList.remove('visible');
    urlInput.focus();
  })();
</script>
</body>
</html>
